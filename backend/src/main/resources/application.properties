spring.application.name=medtracker

# Database connection (matches compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:5432/medtracker
spring.datasource.username=medtracker
spring.datasource.password=medtracker

# Flyway creates the tables; JPA only checks they match our Java classes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Print the SQL that JPA runs, useful while learning
spring.jpa.show-sql=true